<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep Log</title>
<meta name="theme-color" content="#2B59FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#ECEFF3;--card:#fff;--ink:#1D2733;--mute:#66717F;--line:#D5DAE1;--acc:#2B59FF;--ok:#1E9E6A;--bad:#C93A3A}
@media (prefers-color-scheme:dark){:root{--bg:#161B22;--card:#1F2630;--ink:#EAEEF3;--mute:#93A0B0;--line:#303947;--acc:#6C8CFF}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:18px;margin:0}
main{padding:8px 16px;max-width:720px;margin:auto}
.sub{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:14px}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:14px}
nav button[aria-current=page]{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.pad{padding:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
details.ex{border-top:1px solid var(--line)}
details.ex:first-of-type{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .t{flex:1;min-width:0}
summary .t b{display:block}
summary .chev{transition:transform .2s;color:var(--mute)}
details[open] .chev{transform:rotate(90deg)}
.chk{width:28px;height:28px;accent-color:var(--ok);flex:none}
.done b{text-decoration:line-through;color:var(--mute)}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center}
.full{width:100%;max-height:320px;object-fit:cover;display:block}
.noimg{height:120px;background:var(--line);display:grid;place-items:center;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid .card{margin:0}
.grid img,.grid .noimg{width:100%;height:120px;object-fit:cover;display:block}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{cursor:pointer}
.days input{position:absolute;opacity:0}
.days span{display:block;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.days input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.days input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:18px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input[type=text],input[type=number],select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=number]{width:70px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.empty button{margin-top:12px}
.dayhead{display:flex;justify-content:space-between;align-items:center}

.set{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.set .n{width:20px;color:var(--mute);font-size:14px}
.set .x{color:var(--mute);font-size:14px}
.set input{width:72px;padding:9px 8px}
.set.on input{border-color:var(--ok)}
.tog{width:40px;padding:8px 0}
.tog.ok{background:var(--ok);color:#fff;border:0}
.chip[hidden]{display:none}
.prc,.prx{background:#F2B600;color:#1D2733;border-color:#F2B600;font-weight:700;font-size:12px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.tile .big{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tile small{font-size:13px;font-weight:500;color:var(--mute)}
.wk{display:flex;gap:6px;align-items:flex-end;height:120px;margin:12px 0}
.wk .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.wk .col i{display:block;width:100%;background:var(--line);border-radius:6px 6px 0 0}
.wk .col.today i{background:var(--acc)}
.wk .col span{font-size:13px;color:var(--mute)}
.wk .col small{font-size:11px;color:var(--mute);height:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:600;border-top:0}
.up{color:var(--ok)}.dn{color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
#install{display:none}
.item{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Today</h1><div class="sub" id="subtitle"></div></div>
  <button id="install" class="sm">Install app</button>
</header>
<main id="view"></main>
<nav>
  <button data-tab="dash">Dashboard</button>
  <button data-tab="splits">Splits</button>
  <button data-tab="lib">Library</button>
</nav>
<dialog id="dlg"></dialog>

<script>
// ---------- storage (IndexedDB, so uploaded images fit) ----------
const idb = new Promise((res, rej) => {
  const r = indexedDB.open('replog', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const kv = {
  async get(k){const d=await idb;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})},
  async set(k,v){const d=await idb;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})}
};
let S = {library:[], splits:[], logs:{}};
const save = () => kv.set('state', S);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const exById = id => S.library.find(e => e.id === id);
let tab = 'dash';
const $ = s => document.querySelector(s);
const dlg = $('#dlg');

// ---------- views ----------
function render(){
  document.querySelectorAll('nav button').forEach(b => b.dataset.tab===tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  ({dash:dashboard, splits:splitsView, lib:libraryView})[tab]();
}

// ---------- logging helpers ----------
const pad = n => String(n).padStart(2,'0');
const fmtKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateKey = () => fmtKey(new Date());
const fmt = n => Math.round(n).toLocaleString();
const e1 = (w,r) => r===1 ? w : w*(1+r/30);
const okSet = s => s.d && +s.w>0 && +s.r>0;
const exOf = k => k.split(':')[1];
let tm; const saveSoon = () => { clearTimeout(tm); tm = setTimeout(save, 300); };
function rowsFor(k, planned){
  const dk = dateKey(); S.logs[dk] = S.logs[dk] || {};
  return S.logs[dk][k] = S.logs[dk][k] || Array.from({length:planned||3}, () => ({w:'',r:'',d:false}));
}
function lastSets(exId){
  const dk = dateKey();
  for(const d of Object.keys(S.logs).filter(d=>d<dk).sort().reverse())
    for(const k in S.logs[d]) if(exOf(k)===exId){ const a = S.logs[d][k].filter(okSet); if(a.length) return a; }
  return [];
}
function bests(excl){
  const m = {};
  for(const d in S.logs){ if(d===excl) continue;
    for(const k in S.logs[d]) for(const s of S.logs[d][k]){ if(!okSet(s)) continue;
      const b = m[exOf(k)] = m[exOf(k)] || {w:0,e:0};
      b.w = Math.max(b.w,+s.w); b.e = Math.max(b.e, e1(+s.w,+s.r)); } }
  return m;
}
function agg(dates, best){
  const g = {};
  dates.forEach(d => { const L = S.logs[d] || {};
    for(const k in L){ const ex = exById(exOf(k)); if(!ex) continue;
      const a = g[ex.group||'Other'] = g[ex.group||'Other'] || {vol:0,sets:0,reps:0,ir:0};
      const ref = best[ex.id]?.e || 0;
      L[k].filter(okSet).forEach(s => { const w=+s.w, r=+s.r;
        a.vol += w*r; a.sets++; a.reps += r; if(ref) a.ir += r*w/ref*100; }); } });
  return g;
}
function weekDates(off){
  const d = new Date(); d.setDate(d.getDate() - (d.getDay()+6)%7 + off*7);
  return Array.from({length:7}, (_,i) => { const x = new Date(d); x.setDate(d.getDate()+i); return fmtKey(x); });
}
function rerender(){
  const open = [...document.querySelectorAll('details.ex')].map(x=>x.open), y = scrollY;
  dashboard();
  document.querySelectorAll('details.ex').forEach((x,i)=>x.open = open[i]);
  scrollTo(0,y);
}

// ---------- dashboard ----------
function dashboard(){
  const d = new Date(), dow = d.getDay(), dk = dateKey();
  $('#title').textContent = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow];
  $('#subtitle').textContent = d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  const splits = S.splits.filter(s => s.days.includes(dow));
  let html = '';
  if(!splits.length){
    html += `<div class="empty"><b>No workout planned today.</b><br>${S.splits.length?'Assign a day to one of your splits.':'Add exercises to your library, then build a split.'}<br><button data-go="${S.splits.length?'splits':'lib'}">${S.splits.length?'Open splits':'Open library'}</button></div>`;
  } else {
    html += `<div id="tsum"></div>`;
    html += splits.map(s => {
      const items = s.items.filter(i => exById(i.exId));
      return `<section class="card"><div class="pad"><h2>${esc(s.name)}</h2></div>
      ${items.map(i => { const e = exById(i.exId), k = s.id+':'+i.exId, rows = rowsFor(k, i.sets), last = lastSets(e.id);
        return `<details class="ex">
        <summary>
          ${e.img?`<img class="thumb" src="${e.img}" alt="">`:`<span class="thumb">🏋️</span>`}
          <span class="t"><b>${esc(e.name)} <span class="chip prx" hidden>PR</span></b><span class="sub">${i.sets}×${i.reps} planned · <span data-stat></span></span></span>
          <span class="chev">▶</span>
        </summary>
        <div class="exbody" data-k="${k}" data-reps="${i.reps}">
          ${e.img?`<img class="full" src="${e.img}" alt="${esc(e.name)}">`:''}
          <div class="pad">
            <div class="sub">${last.length?'Last: '+last.map(s=>s.w+'×'+s.r).join(', '):'No previous session logged'}</div>
            <div class="sets">${rows.map((r,n) => { const p = last[n] || last[last.length-1] || {};
              return `<div class="set ${r.d?'on':''}" data-i="${n}"><span class="n">${n+1}</span>
              <input type="number" inputmode="decimal" step="any" min="0" data-w value="${esc(r.w)}" placeholder="${p.w??'kg'}" aria-label="Weight set ${n+1}"><span class="x">kg ×</span>
              <input type="number" inputmode="numeric" min="0" data-r value="${esc(r.r)}" placeholder="${p.r??i.reps}" aria-label="Reps set ${n+1}">
              <button class="tog ${r.d?'ok':'ghost'}" data-tog aria-label="Mark set ${n+1} done">✓</button><span class="chip prc" hidden>PR</span></div>`; }).join('')}</div>
            <div class="row" style="margin-top:8px">
              <button class="ghost sm" data-addset>+ Set</button><button class="ghost sm" data-rmset>− Set</button>
              <button class="ghost sm" data-repeat ${last.length?'':'disabled'}>Repeat last</button></div>
            <div class="row" style="margin-top:8px"><span class="sub">Pyramid</span>
              <input type="number" step="any" data-start placeholder="${last[0]?.w??'start kg'}" aria-label="Start weight">
              <input type="number" step="any" data-step placeholder="+2.5" aria-label="Weight step per set">
              <button class="sm" data-pyr>Fill ascending</button></div>
            <div class="sub" data-detail style="margin-top:8px"></div>
          </div>
        </div></details>`; }).join('') || '<div class="empty">This split has no exercises yet.</div>'}
      </section>`; }).join('');
  }
  html += `<div id="wsum"></div>`;
  $('#view').innerHTML = html;
  refreshStats();
}

function refreshStats(){
  const dk = dateKey(), all = bests(null), prior = bests(dk), dow = new Date().getDay();
  document.querySelectorAll('.exbody').forEach(card => {
    const k = card.dataset.k, id = exOf(k), rows = S.logs[dk]?.[k] || [], ref = all[id]?.e || 0, pb = prior[id];
    let vol=0, n=0, reps=0, ir=0, top=0, anyPR=false;
    const els = card.querySelectorAll('.set');
    rows.forEach((s,i) => {
      const w=+s.w, r=+s.r, ok = okSet(s); let pr = false;
      if(ok){ vol += w*r; n++; reps += r; if(ref) ir += r*w/ref*100; top = Math.max(top,w);
        pr = !!pb && (w > pb.w || e1(w,r) > pb.e); }
      anyPR = anyPR || pr; els[i].querySelector('.prc').hidden = !pr;
    });
    const det = card.closest('details');
    det.querySelector('[data-stat]').textContent = `${n}/${rows.length} sets · ${fmt(vol)} kg`;
    det.querySelector('.prx').hidden = !anyPR;
    det.classList.toggle('done', rows.length && n===rows.length);
    card.querySelector('[data-detail]').textContent = n ? `Volume ${fmt(vol)} kg · Top set ${top} kg · Intensity ${Math.round(ir/reps)}% of best 1RM` : 'Log a set to see volume and intensity.';
  });
  // today's muscle groups
  const t = $('#tsum');
  if(t){
    const planned = {};
    S.splits.filter(s=>s.days.includes(dow)).forEach(s => s.items.forEach(i => { const e = exById(i.exId); if(e) planned[e.group||'Other'] = (planned[e.group||'Other']||0) + i.sets; }));
    const a = agg([dk], all);
    const groups = [...new Set([...Object.keys(planned), ...Object.keys(a)])];
    t.innerHTML = `<section class="card pad"><h2>Today by muscle group</h2><div class="tiles">${groups.map(g => { const x = a[g]||{vol:0,sets:0,reps:0,ir:0};
      return `<div class="tile"><b>${esc(g)}</b><span class="big">${fmt(x.vol)} <small>kg</small></span><span class="sub">${x.sets}/${planned[g]||x.sets} sets · ${x.reps?Math.round(x.ir/x.reps):0}% int.</span></div>`; }).join('')}</div></section>`;
  }
  // whole week
  const cur = weekDates(0), prev = weekDates(-1), A = agg(cur, all), B = agg(prev, all);
  const gs = Object.keys(A).concat(Object.keys(B).filter(g=>!A[g])).sort((x,y)=>(A[y]?.vol||0)-(A[x]?.vol||0));
  const daily = cur.map(d => Object.values(agg([d], all)).reduce((s,x)=>s+x.vol,0)), mx = Math.max(1,...daily);
  $('#wsum').innerHTML = `<section class="card pad"><h2>This week</h2>
    <div class="wk">${daily.map((v,i)=>`<div class="col ${cur[i]===dk?'today':''}"><i style="height:${Math.max(3,v/mx*100)}%"></i><span>${['M','T','W','T','F','S','S'][i]}</span><small>${v?fmt(v):''}</small></div>`).join('')}</div>
    ${gs.length?`<table><tr><th>Muscle</th><th>Volume</th><th>Sets</th><th>Int.</th><th>vs last wk</th></tr>${gs.map(g => { const x = A[g]||{vol:0,sets:0,reps:0,ir:0}, p = B[g]?.vol||0, dl = p ? Math.round((x.vol-p)/p*100) : null;
      return `<tr><td>${esc(g)}</td><td>${fmt(x.vol)} kg</td><td>${x.sets}</td><td>${x.reps?Math.round(x.ir/x.reps):0}%</td><td class="${dl>0?'up':dl<0?'dn':''}">${dl===null?'–':(dl>0?'+':'')+dl+'%'}</td></tr>`; }).join('')}</table>`:'<div class="sub">Log sets to build your weekly totals.</div>'}
    <div class="sub" style="margin-top:6px">Volume = weight × reps. Intensity = weight as % of your best estimated 1RM for that exercise.</div></section>`;
}

function splitsView(){
  $('#title').textContent = 'Splits'; $('#subtitle').textContent = 'Plan which exercises you do on which days';
  $('#view').innerHTML = `<button data-new-split>+ New split</button>` + (S.splits.map(s => `
    <div class="card pad">
      <div class="dayhead"><h2>${esc(s.name)}</h2>
        <span class="row"><button class="ghost sm" data-edit-split="${s.id}">Edit</button><button class="danger sm" data-del-split="${s.id}">Delete</button></span></div>
      <div class="row" style="margin:8px 0">${s.days.length?s.days.sort().map(d=>`<span class="chip">${DAYS[d]}</span>`).join(''):'<span class="sub">No days assigned</span>'}</div>
      <div class="sub">${s.items.map(i=>exById(i.exId)).filter(Boolean).map(e=>esc(e.name)).join(', ')||'No exercises'}</div>
    </div>`).join('') || `<div class="empty">No splits yet. Create one, for example “Push Day”.</div>`);
}

function libraryView(){
  $('#title').textContent = 'Library'; $('#subtitle').textContent = 'Every exercise you can use in a split';
  $('#view').innerHTML = `<button data-new-ex>+ New exercise</button><div style="height:12px"></div>` + (S.library.length ? `<div class="grid">${S.library.map(e => `
    <div class="card">
      ${e.img?`<img src="${e.img}" alt="${esc(e.name)}">`:`<div class="noimg">🏋️</div>`}
      <div class="pad"><b>${esc(e.name)}</b><div class="sub">${esc(e.group||'')}</div>
      <div class="row" style="margin-top:8px"><button class="ghost sm" data-edit-ex="${e.id}">Edit</button><button class="danger sm" data-del-ex="${e.id}">Delete</button></div></div>
    </div>`).join('')}</div>` : `<div class="empty">Your library is empty. Add your first exercise with a photo.</div>`);
}

// ---------- exercise form ----------
function resize(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 640, k = Math.min(1, m/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = img.width*k; c.height = img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.82));
    };
    img.src = url;
  });
}
function exForm(id){
  const e = id ? {...exById(id)} : {id:uid(), name:'', group:'', img:''};
  dlg.innerHTML = `<form method="dialog">
    <h2>${id?'Edit exercise':'New exercise'}</h2>
    <label class="f">Exercise name<input type="text" id="exn" value="${esc(e.name)}" required></label>
    <label class="f">Muscle group (used for volume totals)<input type="text" id="exg" list="groups" value="${esc(e.group)}" placeholder="Chest, Back, Quads…"></label><datalist id="groups">${["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core","Forearms"].map(g=>`<option>${g}</option>`).join("")}</datalist>
    <label class="f">Image<input type="file" id="exi" accept="image/*"></label>
    <img id="exp" class="full" style="border-radius:10px;${e.img?'':'display:none'}" ${e.img?`src="${e.img}"`:''} alt="Preview">
    <div class="row"><button type="button" class="ghost grow" id="cancel">Cancel</button><button class="grow" value="ok" id="okb">Save exercise</button></div>
  </form>`;
  dlg.showModal();
  $('#exi').onchange = async ev => { const f=ev.target.files[0]; if(f){ e.img = await resize(f); $('#exp').src=e.img; $('#exp').style.display='block'; } };
  $('#cancel').onclick = () => dlg.close();
  dlg.querySelector('form').onsubmit = async ev => {
    const name = $('#exn').value.trim(); if(!name){ev.preventDefault();return;}
    e.name = name; e.group = $('#exg').value.trim();
    const i = S.library.findIndex(x=>x.id===e.id);
    i>=0 ? S.library[i]=e : S.library.push(e);
    await save(); render();
  };
}

// ---------- split form ----------
function splitForm(id){
  const s = id ? JSON.parse(JSON.stringify(S.splits.find(x=>x.id===id))) : {id:uid(), name:'', days:[], items:[]};
  const draw = () => {
    dlg.innerHTML = `<form method="dialog">
      <h2>${id?'Edit split':'New split'}</h2>
      <label class="f">Split name<input type="text" id="spn" value="${esc(s.name)}" placeholder="Push Day" required></label>
      <div class="f" style="display:grid;gap:4px">Days<div class="days">${DAYS.map((d,i)=>`<label><input type="checkbox" data-day="${i}" ${s.days.includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div></div>
      <div><b>Exercises</b>
        ${s.items.map((it,ix)=>{const e=exById(it.exId);return e?`<div class="item"><span class="nm">${esc(e.name)}</span>
          <input type="number" min="1" value="${it.sets}" data-sets="${ix}" aria-label="Sets"> ×
          <input type="number" min="1" value="${it.reps}" data-reps="${ix}" aria-label="Reps">
          <button type="button" class="ghost sm" data-up="${ix}" aria-label="Move up">↑</button>
          <button type="button" class="danger sm" data-rm="${ix}" aria-label="Remove">✕</button></div>`:''}).join('')||'<div class="sub">Nothing added yet.</div>'}
      </div>
      ${S.library.length?`<div class="row"><select id="pick" class="grow">${S.library.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><button type="button" id="addex" class="ghost">Add</button></div>`:'<div class="sub">Add exercises in the Library first.</div>'}
      <div class="row"><button type="button" class="ghost grow" id="cancel">Cancel</button><button class="grow" value="ok">Save split</button></div>
    </form>`;
    $('#cancel').onclick = () => dlg.close();
    dlg.querySelector('#spn').oninput = ev => s.name = ev.target.value;
    dlg.querySelectorAll('[data-day]').forEach(c => c.onchange = () => { const d=+c.dataset.day; s.days = c.checked ? [...s.days,d] : s.days.filter(x=>x!==d); });
    dlg.querySelectorAll('[data-sets]').forEach(c => c.oninput = () => s.items[c.dataset.sets].sets = +c.value||1);
    dlg.querySelectorAll('[data-reps]').forEach(c => c.oninput = () => s.items[c.dataset.reps].reps = +c.value||1);
    dlg.querySelectorAll('[data-rm]').forEach(c => c.onclick = () => { s.items.splice(+c.dataset.rm,1); draw(); });
    dlg.querySelectorAll('[data-up]').forEach(c => c.onclick = () => { const i=+c.dataset.up; if(i>0){[s.items[i-1],s.items[i]]=[s.items[i],s.items[i-1]]; draw();} });
    const add = $('#addex'); if(add) add.onclick = () => { s.items.push({exId:$('#pick').value, sets:3, reps:10}); draw(); };
    dlg.querySelector('form').onsubmit = async ev => {
      if(!s.name.trim()){ev.preventDefault();return;}
      const i = S.splits.findIndex(x=>x.id===s.id);
      i>=0 ? S.splits[i]=s : S.splits.push(s);
      await save(); render();
    };
  };
  draw(); dlg.showModal();
}

// ---------- events ----------
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ tab = d.tab; render(); }
  else if(d.go){ tab = d.go; render(); }
  else if('newEx' in d) exForm();
  else if(d.editEx) exForm(d.editEx);
  else if(d.delEx){
    const used = S.splits.filter(s=>s.items.some(i=>i.exId===d.delEx)).length;
    if(confirm(used ? `This exercise is used in ${used} split(s). Delete it and remove it from them?` : 'Delete this exercise?')){
      S.library = S.library.filter(e=>e.id!==d.delEx);
      S.splits.forEach(s => s.items = s.items.filter(i=>i.exId!==d.delEx));
      await save(); render();
    }
  }
  else if('newSplit' in d) splitForm();
  else if(d.editSplit) splitForm(d.editSplit);
  else if(d.delSplit){ if(confirm('Delete this split?')){ S.splits = S.splits.filter(s=>s.id!==d.delSplit); await save(); render(); } }
});
// ---------- set logging events ----------
const rowOf = t => { const el = t.closest('.set'); return rowsFor(el.closest('.exbody').dataset.k)[+el.dataset.i]; };
document.addEventListener('input', ev => {
  const t = ev.target; if(!t.closest('.set') || !t.matches('[data-w],[data-r]')) return;
  rowOf(t)[t.matches('[data-w]') ? 'w' : 'r'] = t.value; saveSoon(); refreshStats();
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if(!t) return;
  const card = t.closest('.exbody'), d = t.dataset; if(!card) return;
  const k = card.dataset.k, dk = dateKey(), rows = rowsFor(k), last = lastSets(exOf(k));
  if('tog' in d){
    const r = rowOf(t), i = +t.closest('.set').dataset.i, p = last[i] || last[last.length-1];
    r.d = !r.d;
    if(r.d && p){ if(r.w==='') r.w = p.w; if(r.r==='') r.r = p.r; }   // done with no entry = repeat previous
  }
  else if('addset' in d) rows.push({w:'',r:'',d:false});
  else if('rmset' in d){ if(rows.length>1) rows.pop(); }
  else if('repeat' in d) S.logs[dk][k] = last.map(s => ({w:s.w, r:s.r, d:false}));
  else if('pyr' in d){
    const st = card.querySelector('[data-start]'), sp = card.querySelector('[data-step]');
    const start = +st.value || +last[0]?.w, step = sp.value===''?2.5:+sp.value;
    if(!start){ alert('Enter a starting weight.'); return; }
    rows.forEach((r,i) => { r.w = +(start+step*i).toFixed(2); r.r = card.dataset.reps; r.d = false; });
  } else return;
  saveSoon(); rerender();
});

// ---------- install + service worker ----------
let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#install').style.display='block'; });
$('#install').onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').style.display='none'; };
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

// ---------- start ----------
(async () => { const s = await kv.get('state'); if(s) S = {library:[],splits:[],logs:{},...s}; render(); })();
</script>
</body>
